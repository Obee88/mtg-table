name: deploy-api
on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'tsconfig.base.json'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          SHA=${GITHUB_SHA::12}
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$OWNER/mtg-table-api:$SHA" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/$OWNER/mtg-table-api:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Notify VPS dashboard
        env:
          URL: ${{ secrets.API_WEBHOOK_URL }}
          SECRET: ${{ secrets.API_WEBHOOK_SECRET }}
          IMAGE: ${{ steps.meta.outputs.image }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          URL=$(printf '%s' "$URL" | tr -d '[:space:]')
          TS=$(date +%s)
          BODY=$(jq -nc --arg image "$IMAGE" --arg sha "$SHA" --argjson ts "$TS" '{ image: $image, sha: $sha, ts: $ts }')
          SIG="sha256=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$SECRET" | awk '{print $2}')"
          curl -sf -X POST "$URL" -H "Content-Type: application/json" -H "X-Signature: $SIG" -d "$BODY"
